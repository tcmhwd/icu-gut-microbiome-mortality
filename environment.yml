# Statistical-analysis environment (clinical model, integration, literature panel, external
# benchmarking, MDRO analyses). Versions marked "manuscript" are those stated in the
# Supplementary Methods; the others were read from the analysis environment's package metadata.
# Bioinformatics tools (MetaPhlAn, HUMAnN, MEGAHIT, binning, CheckM2, dRep, Prokka, eggNOG-mapper,
# antiSMASH, RGI, GTDB-Tk, CoverM) ran in separate per-tool conda environments; see README.md.
name: icu-microbiome-mortality
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.19          # manuscript
  - numpy=1.26.4            # manuscript
  - pandas=2.1.4            # manuscript
  - scipy=1.11.4            # manuscript
  - scikit-learn=1.4.2      # manuscript
  - statsmodels=0.14.6      # manuscript
  - matplotlib=3.7.5        # manuscript
  - joblib=1.3.2
  - openpyxl                # reads PRJNA842425 metadata.xlsx
  - pyarrow                 # parquet frames in the clinical pipeline
  - r-base=4.4.3            # manuscript
  - r-logistf=1.26.1        # manuscript (Firth regression, utils/run_firth_logistf.R)
  - r-survival=3.8.6        # manuscript
  - r-ggplot2               # figures (version not stated in the manuscript)
  - r-dplyr
  - r-readr
  - r-tidyr
  - r-stringr
  - r-patchwork
  - pip
  - pip:
      - catboost==1.2.8     # manuscript
      - optuna==4.6.0
      - pycaret==3.3.2
      - torch==2.5.1
      - pytorch-tabnet==4.1.0
      - lightgbm==4.6.0
      - xgboost==2.0.3
      - openai==2.9.0       # lit03 embeddings, lit04 GPT-4o-mini extraction
